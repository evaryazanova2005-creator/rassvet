<head>

    <path d="M200 200 L303.9 140 A120 120 0 0 1 303.9 260Z" fill="rgba(162,160,67,0.3)" stroke="#a2a043" stroke-width="1.5"/>
    <path d="M200 200 L303.9 260 A120 120 0 0 1 200 320Z" fill="rgba(162,160,67,0.55)" stroke="#a2a043" stroke-width="1.5"/>

<style>
  :root {
    --bg: #f6f6e8;
    --bg-card: #fbfbf2;
    --bg-soft: #eaead4;
    --ink: #2b2b1a;
    --ink-soft: #6b6b4a;
    --accent: #a2a043;
    --accent-soft: #c4c38a;
    --border: #d6d5b4;
    --radius-sm: 14px;
    --radius: 22px;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Onest', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    font-size: 16px;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(120px); z-index: 0; pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(162,160,67,0.18), transparent 70%);
    top: -150px; right: -100px;
  }
  body::after {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(196,195,138,0.18), transparent 70%);
    bottom: -200px; left: -150px;
  }

  nav, header, footer, section, main { position: relative; z-index: 1; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; color: var(--ink); }
  h1 { font-size: clamp(2rem, 5vw, 3rem); }
  em { font-style: italic; color: var(--accent); }
  p { margin-bottom: 0.8em; }
  p:last-child { margin-bottom: 0; }
  a { color: var(--accent); text-decoration: none; }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .container--narrow { max-width: 680px; }

  nav {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    background: rgba(246, 246, 232, 0.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100;
  }
  nav .container { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  nav .brand { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
  nav .back-link { font-size: 0.85rem; color: var(--ink-soft); }
  nav .back-link:hover { color: var(--accent); }

  header {
    padding: 48px 0 16px;
    text-align: center;
  }
  header p { color: var(--ink-soft); font-size: 0.95rem; margin-top: 8px; }

  main { padding: 20px 0 60px; }

  /* Split layout: sticky wheel left, cards right */
  .wheel-layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
    align-items: start;
  }
  .wheel-sticky {
    position: sticky;
    top: 80px;
    padding: 20px 0;
  }
  .wheel-cards {
    min-width: 0;
  }
  @media (max-width: 820px) {
    .wheel-layout {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .wheel-sticky {
      position: static;
    }
  }

  footer {
    padding: 40px 0 32px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  footer p { color: var(--ink-soft); font-size: 0.82rem; }
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="club.html" class="brand">Рассвет · клуб</a>
    <a href="club.html" class="back-link">← Назад</a>
  </div>
</nav>

<header>
  <div class="container">
    <h1>Колесо <em>баланса</em></h1>
    <p>Оцени 6 сфер жизни, выдели приоритеты и запиши цели на месяц</p>
  </div>
</header>

<main>
  <div class="container">
    <div id="app"></div>
  </div>
</main>

<footer>
  <div class="container">
    <p>Данные сохраняются в твоём браузере. Заполняй колесо в начале каждого месяца.</p>
  </div>
</footer>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="wheel-chart.jsx"></script>
<script type="text/babel" src="wheel-app.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('app'));
  root.render(<WheelApp />);
</script>
</body>
</html>
