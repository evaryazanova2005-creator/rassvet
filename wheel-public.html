<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Колесо баланса от клуба «Рассвет» — бесплатный инструмент, чтобы оценить ключевые сферы жизни и понять, чему дать больше внимания.">
<title>Рассвет · Колесо баланса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf3e7;
    --bg-card: #fffaf2;
    --bg-soft: #f2e8d0;
    --ink: #1d150c;
    --ink-soft: #6b5c3e;
    --accent: #a2a043;
    --accent-soft: #c4c38a;
    --border: #e8dcc4;
    --radius-sm: 14px;
    --radius: 22px;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Onest', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    font-size: 16px;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(120px); z-index: 0; pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(233,109,42,0.10), transparent 70%);
    top: -150px; right: -100px;
  }
  body::after {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(162,160,67,0.14), transparent 70%);
    bottom: -200px; left: -150px;
  }

  nav, header, footer, section, main { position: relative; z-index: 1; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; color: var(--ink); }
  h1 { font-size: clamp(2rem, 5vw, 3rem); }
  em { font-style: italic; color: var(--accent); }
  p { margin-bottom: 0.8em; }
  p:last-child { margin-bottom: 0; }
  a { color: var(--accent); text-decoration: none; }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .container--narrow { max-width: 680px; }

  nav {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    background: rgba(250, 243, 231, 0.92);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100;
  }
  nav .container { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  nav .brand { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); font-weight: 500; }
  nav .nav-links { display: flex; gap: 20px; align-items: center; }
  nav .back-link { font-size: 0.85rem; color: var(--ink-soft); text-decoration: none; transition: color .15s; }
  nav .back-link:hover { color: var(--accent); }

  main { padding: 24px 0 60px; }

  /* Split layout: sticky wheel left, cards right */
  .wheel-layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
    align-items: start;
  }
  .wheel-sticky {
    position: sticky;
    top: 80px;
    padding: 20px 0;
  }
  .wheel-cards {
    min-width: 0;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .cards-grid { grid-template-columns: 1fr; }
  }

  footer {
    padding: 40px 0 32px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  footer p { color: var(--ink-soft); font-size: 0.82rem; }
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="index.html" class="brand">Рассвет</a>
    <div class="nav-links">
      <a href="index.html" class="back-link">← Назад в клуб</a>
      <a href="stratsession.html" class="back-link">Обратно в конспект →</a>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div id="app"></div>
  </div>
</main>

<footer>
  <div class="container">
    <p>Данные сохраняются в твоём браузере. Заполняй колесо в начале каждого месяца.</p>
  </div>
</footer>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.WHEEL_STORAGE_KEY = 'rassvet_wheel_public';</script>
<script type="text/babel" src="wheel-chart.jsx"></script>
<script type="text/babel" src="wheel-app.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('app'));
  root.render(<WheelApp />);
</script>
</body>
</html>
